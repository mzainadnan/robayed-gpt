<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robayed GPT</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white;">

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1a1a1a; border-bottom: 1px solid #2d2d2d;">
        <div style="display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 20px;">
            <span style="color: #007acc;">●</span> Robayed GPT
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="authenticatedUserZone" style="display: none; align-items: center; gap: 15px;">
                <span id="welcomeMessage" style="font-size: 14px; color: #aaa;"></span>
                <button id="logoutBtn" style="background: #cc3333; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
            </div>
        </div>
    </header>

    <div id="homeScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 80vh; padding: 20px;">
        <h1 style="font-size: 48px; margin-bottom: 20px; font-weight: 800; letter-spacing: -1px;">The Next Generation AI Workspace</h1>
        <p style="font-size: 18px; color: #aaa; max-width: 600px; margin-bottom: 40px; line-height: 1.6;">Access advanced pipeline mechanics, interactive modules, and customized AI computing interfaces.</p>
        <button id="startChatBtn" style="background: #007acc; color: white; border: none; padding: 16px 36px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 14px rgba(0,122,204,0.4);">Start Chatting →</button>
    </div>

    <div id="welcomeGatewayZone" style="display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 70vh; padding: 20px;">
        <div style="background: #1a1a1a; padding: 40px; border-radius: 16px; border: 1px solid #2d2d2d; max-width: 400px; width: 100%; box-sizing: border-box;">
            <h2 style="font-size: 28px; margin-top: 0; margin-bottom: 10px;">Verification Required</h2>
            <p style="font-size: 14px; color: #aaa; margin-bottom: 30px;">Sign in securely using GitHub to unlock your active workspace session.</p>
            
            <button id="githubAuthBtn" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; background: #24292e; color: white; border: 1px solid #444; cursor: pointer; font-weight: bold; transition: 0.2s;">
                <svg height="20" width="20" viewBox="0 0 16 16" fill="white"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                Continue with GitHub
            </button>

            <button id="backToHomeFromAuth" style="background: transparent; color: #666; border: none; margin-top: 25px; cursor: pointer; font-size: 13px;">← Back to Home</button>
        </div>
    </div>

    <div id="chatDashboardZone" style="display: none; max-width: 800px; margin: 30px auto; padding: 20px; box-sizing: border-box;">
        <main style="background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px; height: 55vh; display: flex; flex-direction: column;">
            <div id="chatMessages" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;">
                <div style="background: rgba(0,122,204,0.1); border: 1px solid rgba(0,122,204,0.2); padding: 12px; border-radius: 8px; color: #007acc; font-size: 14px; text-align: center;">
                    Secure End-to-End Encrypted Session Initialized.
                </div>
            </div>
        </main>

        <footer style="margin-top: 20px; display: flex; gap: 12px;">
            <input type="text" id="chatInput" placeholder="Type your message here..." style="flex: 1; padding: 16px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px;" />
            <button id="sendBtn" style="padding: 0 30px; border-radius: 8px; background: #007acc; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px;">Send</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
