<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robayed GPT</title>
    
    <style>
        /* Import a retro-style pixel font */
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            /* Keeps pixel images crisp and un-blurred when scaling */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            margin: 0;
            font-family: 'Courier Prime', monospace;
            background-color: #1a1a1a;
            color: #dbdbdb;
        }

        /* Standardized Retro Borders */
        .pixel-border {
            border: 4px solid #000000;
            box-shadow: 
                inset -4px -4px 0px 0px #4a4a4a,
                inset 4px 4px 0px 0px #ffffff;
        }

        .pixel-border-inset {
            border: 4px solid #000000;
            box-shadow: 
                inset -4px -4px 0px 0px #ffffff,
                inset 4px 4px 0px 0px #4a4a4a;
            background-color: #262626;
        }

        /* Retro Arcade Buttons */
        .pixel-btn {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ffffff;
            background-color: #4a4a4a;
            border: 4px solid #000000;
            box-shadow: 
                inset -4px -4px 0px 0px #262626,
                inset 4px 4px 0px 0px #8b8b8b;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .pixel-btn:active {
            box-shadow: 
                inset 4px 4px 0px 0px #262626,
                inset -4px -4px 0px 0px #8b8b8b;
            padding: 14px 22px 10px 26px;
        }

        /* Chat scrollbar pixel style */
        #chatMessages::-webkit-scrollbar {
            width: 12px;
        }
        #chatMessages::-webkit-scrollbar-track {
            background: #262626;
            border-left: 4px solid #000;
        }
        #chatMessages::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border: 2px solid #000;
        }
    </style>
    
    <link rel="icon" type="image/png" href="assets/ai-sprite.png">
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #262626; border-bottom: 4px solid #000000;">
        <div style="display: flex; align-items: center; gap: 12px; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff;">
            <img src="assets/ai-sprite.png" alt="AI" style="width: 24px; height: 24px; object-fit: contain;" onerror="this.style.backgroundColor='#fff'">
            Robayed GPT
        </div>
    </header>

    <div id="homeScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 80vh; padding: 20px;">
        <h1 style="font-family: 'Press Start 2P', monospace; font-size: 28px; line-height: 1.5; margin-bottom: 24px; color: #ffffff; max-width: 700px;">The Next Gen AI Workspace</h1>
        <p style="font-size: 18px; color: #8b8b8b; max-width: 600px; margin-bottom: 40px; line-height: 1.6; font-weight: bold;">Access advanced pipeline mechanics, interactive modules, and customized AI computing interfaces.</p>
        <button id="startChatBtn" class="pixel-btn">Start Chatting</button>
    </div>

    <div id="chatDashboardZone" style="display: none; max-width: 800px; margin: 30px auto; padding: 20px;">
        <main class="pixel-border-inset" style="height: 50vh; display: flex; flex-direction: column;">
            <div id="chatMessages" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;">
                <div style="border: 2px dashed #4a4a4a; padding: 12px; color: #8b8b8b; font-size: 14px; text-align: center; font-family: 'Press Start 2P', monospace; font-size: 10px;">
                    [ AI SYSTEM INITIALIZED ]
                </div>
            </div>
        </main>

        <footer style="margin-top: 24px; display: flex; gap: 12px; align-items: stretch;">
            <input type="text" id="chatInput" class="pixel-border-inset" placeholder="Type your message here..." style="flex: 1; padding: 16px; color: #fff; font-size: 16px; font-family: 'Courier Prime', monospace; outline: none;" />
            <button id="sendBtn" class="pixel-btn" style="font-size: 12px;">Send</button>
        </footer>
    </div>

    <script>
        const BACKEND_SERVER_URL = 'https://robayed-gpt-backend.onrender.com';

        // Instant execution handler to prevent browser freeze hooks
        function initApp() {
            const homeScreen = document.getElementById('homeScreen');
            const chatDashboardZone = document.getElementById('chatDashboardZone');
            const startChatBtn = document.getElementById('startChatBtn');
            const sendBtn = document.getElementById('sendBtn');
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');

            // Force button action regardless of asset load states
            if (startChatBtn) {
                startChatBtn.onclick = function() {
                    if (homeScreen) homeScreen.style.display = 'none';
                    if (chatDashboardZone) chatDashboardZone.style.display = 'block';
                };
            }

            function appendMessage(text, sender) {
                if (!chatMessages) return;

                const wrapperDiv = document.createElement('div');
                wrapperDiv.style.display = "flex";
                wrapperDiv.style.gap = "12px";
                wrapperDiv.style.alignItems = "flex-start";
                wrapperDiv.style.maxWidth = "85%";

                const msgDiv = document.createElement('div');
                msgDiv.style.padding = "12px 16px";
                msgDiv.style.fontSize = "16px";
                msgDiv.style.lineHeight = "1.4";
                msgDiv.style.border = "4px solid #000000";

                if (sender === 'user') {
                    wrapperDiv.style.alignSelf = "flex-end";
                    msgDiv.style.background = "#4a4a4a";
                    msgDiv.style.color = "#ffffff";
                    msgDiv.style.boxShadow = "inset -3px -3px 0px 0px #262626";
                    wrapperDiv.appendChild(msgDiv);
                } else {
                    wrapperDiv.style.alignSelf = "flex-start";
                    msgDiv.style.background = "#333333";
                    msgDiv.style.color = "#dbdbdb";
                    msgDiv.style.boxShadow = "inset -3px -3px 0px 0px #1a1a1a";

                    const avatarImg = document.createElement('img');
                    avatarImg.src = "assets/ai-sprite.png";
                    avatarImg.alt = "AI";
                    // Fallback block background if image is missing
                    avatarImg.onerror = function() { this.style.backgroundColor = '#8b8b8b'; };
                    avatarImg.style.width = "32px";
                    avatarImg.style.height = "32px";
                    avatarImg.style.objectFit = "contain";
                    avatarImg.style.flexShrink = "0";
                    avatarImg.style.border = "2px solid #000";

                    wrapperDiv.appendChild(avatarImg);
                    wrapperDiv.appendChild(msgDiv);
                }

                msgDiv.textContent = text;
                chatMessages.appendChild(wrapperDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            async function sendMessage() {
                const messageText = chatInput.value.trim();
                if (!messageText) return;
                
                appendMessage(messageText, 'user');
                chatInput.value = '';

                try {
                    const response = await fetch(`${BACKEND_SERVER_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: messageText })
                    });

                    if (!response.ok) throw new Error(`Status: ${response.status}`);
                    const data = await response.json();
                    appendMessage(data.reply || data.response || "No response received.", 'ai');
                } catch (error) {
                    console.error(error);
                    appendMessage("[ERROR: PIPELINE OFFLINE]", 'ai');
                }
            }

            if (sendBtn) sendBtn.onclick = sendMessage;
            if (chatInput) {
                chatInput.onkeypress = function(e) {
                    if (e.key === 'Enter') sendMessage();
                };
            }
        }

        // Dual-execution setup to guarantee performance regardless of execution environment
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
