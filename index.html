<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robayed GPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="home-screen" id="homeScreen">
        <header class="home-navbar">
            <div class="home-logo-zone">
                <img src="assets/ai-sprite.png" alt="Logo" class="logo">
                <span>Robayed GPT</span>
            </div>
            <div class="home-nav-links">
                <button class="nav-link-btn" id="openAbout">About</button>
                <span id="welcomeMessage" style="display: none; color: white; font-weight: bold; font-size: 14px; margin-left: 10px;"></span>
            </div>
        </header>

        <div id="welcomeGatewayZone" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin: 40px auto; padding: 30px; max-width: 500px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: white;">
            <h1 style="font-size: 32px; margin-bottom: 10px; font-weight: 700;">Get Started</h1>
            <p style="font-size: 16px; color: #ccc; margin-bottom: 25px;">Welcome to Robayed GPT. Please authenticate your security account details to unlock the AI dashboard pipeline interface below.</p>
            
            <div id="loginFormContainer" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
                <input type="text" id="usernameInput" placeholder="Enter Username" style="padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: #fff; font-size: 14px; width: 100%; box-sizing: border-box;">
                <input type="password" id="passwordInput" placeholder="Enter Password" style="padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: #fff; font-size: 14px; width: 100%; box-sizing: border-box;">
                <button class="nav-link-btn" id="loginSubmitBtn" style="padding: 12px; font-size: 16px; border-radius: 6px; background: #007acc; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s;">Secure Login</button>
            </div>
        </div>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                </div>
        </main>

        <footer class="chat-input-area" style="margin-top: 20px;">
            <input type="text" id="chatInput" placeholder="Please log in above using the Get Started form to unlock chat..." disabled style="width: 80%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #fff;" />
            <button id="sendBtn" disabled style="padding: 12px 24px; border-radius: 6px; background: #333; color: #777; border: none;">Send</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
