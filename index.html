<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robayed GPT</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            margin: 0;
            font-family: 'Courier Prime', monospace;
            background-color: #1a1a1a;
            color: #dbdbdb;
        }

        /* Retro Bevel Borders */
        .pixel-border-inset {
            border: 4px solid #000000;
            box-shadow: 
                inset -4px -4px 0px 0px #ffffff,
                inset 4px 4px 0px 0px #4a4a4a;
            background-color: #262626;
        }

        /* High-Contrast Theme Arcade Button */
        .pixel-btn {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ffffff;
            background-color: #5a5a5a;
            border: 4px solid #000000;
            box-shadow: 
                inset -4px -4px 0px 0px #333333,
                inset 4px 4px 0px 0px #a6a6a6;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .pixel-btn:active {
            box-shadow: 
                inset 4px 4px 0px 0px #333333,
                inset -4px -4px 0px 0px #a6a6a6;
            padding: 14px 22px 10px 26px;
        }

        /* Ultra-Mini Copy Action Trigger Button */
        .pixel-copy-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px; /* Made smaller */
            background: #4a4a4a;
            color: #fff;
            border: 2px solid #000;
            cursor: pointer;
            padding: 2px 4px; /* Tightened padding */
            margin-top: 5px;  /* Reduced margin spacing */
            display: inline-block;
            text-transform: uppercase;
        }
        
        .pixel-copy-btn:active {
            background: #262626;
        }

        /* CSS Rendered Theme Placeholder Icon */
        .theme-pixel-icon {
            width: 24px;
            height: 24px;
            background: #8b8b8b;
            border: 2px solid #fff;
            box-shadow: 2px 2px 0px #000;
            display: inline-block;
        }

        #chatMessages::-webkit-scrollbar {
            width: 12px;
        }
        #chatMessages::-webkit-scrollbar-track {
            background: #262626;
            border-left: 4px solid #000;
        }
        #chatMessages::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border: 2px solid #000;
        }

        /* Slower 5px Retro Thinking Animation */
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); } /* Higher shift */
        }

        .thinking-sprite {
            animation: pixelBounce 0.8s steps(2) infinite; /* Slowed down to 0.8s */
        }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #262626; border-bottom: 4px solid #000000;">
        <div style="display: flex; align-items: center; gap: 12px; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff;">
            <img src="assets/ai-sprite.png" alt="" style="width: 24px; height: 24px; object-fit: contain; display: block;" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='inline-block';">
            <div id="fallback-icon" class="theme-pixel-icon" style="display: none;"></div>
            Robayed GPT
        </div>
    </header>

    <div id="homeScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 80vh; padding: 20px;">
        <h1 style="font-family: 'Press Start 2P', monospace; font-size: 26px; line-height: 1.6; margin-bottom: 24px; color: #ffffff; max-width: 700px;">The Next Gen AI Workspace</h1>
        <p style="font-size: 18px; color: #8b8b8b; max-width: 600px; margin-bottom: 40px; line-height: 1.6; font-weight: bold;">Access advanced pipeline mechanics, interactive modules, and customized AI computing interfaces.</p>
        <button id="startChatBtn" class="pixel-btn" onclick="document.getElementById('homeScreen').style.display='none'; document.getElementById('chatDashboardZone').style.display='block';">Start Chatting</button>
    </div>

    <div id="chatDashboardZone" style="display: none; max-width: 800px; margin: 30px auto; padding: 20px;">
        <main class="pixel-border-inset" style="height: 50vh; display: flex; flex-direction: column;">
            <div id="chatMessages" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;">
                <div style="border: 2px dashed #4a4a4a; padding: 12px; color: #8b8b8b; font-family: 'Press Start 2P', monospace; font-size: 10px; text-align: center;">
                    [ AI SYSTEM INITIALIZED ]
                </div>
            </div>
        </main>

        <footer style="margin-top: 24px; display: flex; gap: 12px; align-items: stretch;">
            <input type="text" id="chatInput" class="pixel-border-inset" placeholder="Type your message here..." style="flex: 1; padding: 16px; color: #fff; font-size: 16px; font-family: 'Courier Prime', monospace; outline: none;" />
            <button id="sendBtn" class="pixel-btn" style="font-size: 12px;">Send</button>
        </footer>
    </div>

    <script>
        const BACKEND_SERVER_URL = 'https://robayed-gpt-backend.onrender.com';

        function initChatEngine() {
            const sendBtn = document.getElementById('sendBtn');
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');

            function cleanMarkdown(text) {
                if (!text) return "";
                return text.replace(/\*/g, '');
            }

            function appendMessage(rawText, sender) {
                if (!chatMessages) return null;

                const text = cleanMarkdown(rawText);

                const wrapperDiv = document.createElement('div');
                wrapperDiv.style.display = "flex";
                wrapperDiv.style.gap = "12px";
                wrapperDiv.style.alignItems = "flex-start";
                wrapperDiv.style.maxWidth = "85%";

                const blockContainer = document.createElement('div');
                blockContainer.style.display = "flex";
                blockContainer.style.flexDirection = "column";

                const msgDiv = document.createElement('div');
                msgDiv.style.padding = "12px 16px";
                msgDiv.style.fontSize = "16px";
                msgDiv.style.lineHeight = "1.4";
                msgDiv.style.border = "4px solid #000000";
                msgDiv.textContent = text;

                if (sender === 'user') {
                    wrapperDiv.style.alignSelf = "flex-end";
                    msgDiv.style.background = "#5a5a5a";
                    msgDiv.style.color = "#ffffff";
                    msgDiv.style.boxShadow = "inset -3px -3px 0px 0px #333333";
                    blockContainer.appendChild(msgDiv);
                    wrapperDiv.appendChild(blockContainer);
                } else {
                    wrapperDiv.style.alignSelf = "flex-start";
                    msgDiv.style.background = "#2b2b2b";
                    msgDiv.style.color = "#dbdbdb";
                    msgDiv.style.boxShadow = "inset -3px -3px 0px 0px #111111";

                    const avatarContainer = document.createElement('div');
                    avatarContainer.style.width = "32px";
                    avatarContainer.style.height = "32px";
                    avatarContainer.style.flexShrink = "0";

                    if (sender === 'thinking') {
                        avatarContainer.classList.add('thinking-sprite');
                    }

                    const avatarImg = document.createElement('img');
                    avatarImg.src = "assets/ai-sprite.png";
                    avatarImg.alt = "";
                    avatarImg.style.width = "100%";
                    avatarImg.style.height = "100%";
                    avatarImg.style.objectFit = "contain";
                    
                    avatarImg.onerror = function() {
                        this.style.display = 'none';
                        avatarContainer.style.backgroundColor = '#8b8b8b';
                        avatarContainer.style.border = '2px solid #fff';
                        avatarContainer.style.boxShadow = '2px 2px 0px #000';
                    };

                    avatarContainer.appendChild(avatarImg);
                    wrapperDiv.appendChild(avatarContainer);
                    
                    blockContainer.appendChild(msgDiv);

                    if (sender === 'ai') {
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'pixel-copy-btn';
                        copyBtn.textContent = '[Copy]';
                        copyBtn.onclick = function() {
                            navigator.clipboard.writeText(text).then(() => {
                                copyBtn.textContent = '[Copied!]';
                                setTimeout(() => {
                                    copyBtn.textContent = '[Copy]';
                                }, 1500);
                            }).catch(err => {
                                console.error('Copy function failed:', err);
                            });
                        };
                        blockContainer.appendChild(copyBtn);
                    }

                    wrapperDiv.appendChild(blockContainer);
                }

                chatMessages.appendChild(wrapperDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                return wrapperDiv;
            }

            async function sendMessage() {
                const messageText = chatInput.value.trim();
                if (!messageText) return;
                
                appendMessage(messageText, 'user');
                chatInput.value = '';

                const thinkingBubble = appendMessage(". . .", 'thinking');

                try {
                    const response = await fetch(`${BACKEND_SERVER_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: messageText })
                    });

                    if (thinkingBubble) thinkingBubble.remove();

                    if (!response.ok) throw new Error(`Status: ${response.status}`);
                    const data = await response.json();
                    
                    const responseText = data.reply || data.response || "No response data returned.";
                    appendMessage(responseText, 'ai');
                } catch (error) {
                    console.error(error);
                    if (thinkingBubble) thinkingBubble.remove();
                    appendMessage("[SYSTEM ERROR: PIPELINE CONNECTION REFUSED]", 'ai');
                }
            }

            if (sendBtn) sendBtn.onclick = sendMessage;
            if (chatInput) {
                chatInput.onkeypress = function(e) {
                    if (e.key === 'Enter') sendMessage();
                };
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initChatEngine);
        } else {
            initChatEngine();
        }
    </script>
</body>
</html>
