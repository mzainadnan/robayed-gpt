<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robayed GPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="home-screen" id="homeScreen">
        <header class="home-navbar">
            <div class="home-logo-zone">
                <img src="assets/ai-sprite.png" alt="Logo" class="logo">
                <span>Robayed GPT</span>
            </div>
            <div class="home-nav-links">
                <button class="nav-link-btn" id="openAbout">About</button>
                
                <div id="loginFormContainer" style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="usernameInput" placeholder="Username" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #333; font-size: 14px;">
                    <input type="password" id="passwordInput" placeholder="Password" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #333; font-size: 14px;">
                    <button class="nav-link-btn" id="loginSubmitBtn">Login</button>
                </div>
                
                <span id="welcomeMessage" style="display: none; color: white; font-weight: bold; font-size: 14px; margin-left: 10px;"></span>
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                </div>
        </main>

        <footer class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Please login above to unlock chat..." disabled style="width: 80%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;" />
            <button id="sendBtn" disabled style="padding: 10px 20px;">Send</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
